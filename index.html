<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spud Squad - 3D Survivors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', system-ui, sans-serif; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }

    #ui-layer {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .menu-screen {
      pointer-events: all;
      text-align: center;
      color: #fff;
    }
    .menu-screen h1 {
      font-size: 72px; font-weight: 900; letter-spacing: 4px;
      background: linear-gradient(135deg, #ffb13b, #ff5f6d, #c46bff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(255, 177, 59, 0.3);
      margin-bottom: 8px;
    }
    .menu-screen .subtitle { color: #8892b0; font-size: 18px; margin-bottom: 40px; letter-spacing: 2px; }

    .char-select { display: flex; gap: 16px; justify-content: center; margin-bottom: 32px; }
    .char-card {
      width: 140px; padding: 20px 12px; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
      transition: all 0.2s; text-align: center;
    }
    .char-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-4px); }
    .char-card.selected { border-color: var(--char-color); background: rgba(255,255,255,0.1); box-shadow: 0 0 24px var(--char-color); }
    .char-card .icon { font-size: 40px; margin-bottom: 8px; }
    .char-card .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .char-card .desc { font-size: 11px; color: #8892b0; line-height: 1.4; }

    .btn {
      pointer-events: all; cursor: pointer; border: none; outline: none;
      padding: 14px 48px; font-size: 18px; font-weight: 700; letter-spacing: 2px;
      border-radius: 8px; color: #0a0a12;
      background: linear-gradient(135deg, #ffb13b, #ff7a3b);
      transition: all 0.2s; text-transform: uppercase;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 177, 59, 0.5); }

    #hud {
      position: absolute; top: 0; left: 0; right: 0; padding: 16px 24px;
      display: none; pointer-events: none;
    }
    #hud .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    #hud .hp-bar {
      width: 280px; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px;
      overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
    }
    #hud .hp-fill {
      height: 100%; border-radius: 10px;
      background: linear-gradient(90deg, #ff4d6d, #ff7a3b);
      transition: width 0.2s;
    }
    #hud .hp-text { font-size: 12px; color: #fff; margin-top: 4px; text-align: center; }
    #hud .stats { color: #fff; font-size: 14px; text-align: right; line-height: 1.8; }
    #hud .stats span { color: #ffb13b; font-weight: 700; }

    #wave-banner {
      position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
      font-size: 48px; font-weight: 900; color: #fff; letter-spacing: 6px;
      text-shadow: 0 0 40px rgba(255, 177, 59, 0.6);
      opacity: 0; transition: opacity 0.5s; pointer-events: none;
    }

    #levelup-screen {
      position: absolute; inset: 0; display: none;
      background: rgba(0,0,0,0.7); pointer-events: all;
      flex-direction: column; align-items: center; justify-content: center;
    }
    #levelup-screen h2 { color: #ffb13b; font-size: 36px; margin-bottom: 24px; letter-spacing: 4px; }
    #levelup-screen .cards { display: flex; gap: 20px; }
    .upgrade-card {
      width: 200px; padding: 24px; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.1);
      transition: all 0.2s; text-align: center; color: #fff;
    }
    .upgrade-card:hover { transform: translateY(-6px) scale(1.03); border-color: #ffb13b; box-shadow: 0 0 30px rgba(255, 177, 59, 0.3); }
    .upgrade-card .icon { font-size: 36px; margin-bottom: 12px; }
    .upgrade-card .title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .upgrade-card .desc { font-size: 12px; color: #8892b0; line-height: 1.5; }

    #gameover-screen {
      position: absolute; inset: 0; display: none;
      background: rgba(0,0,0,0.8); pointer-events: all;
      flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center;
    }
    #gameover-screen h2 { font-size: 56px; color: #ff4d6d; margin-bottom: 16px; }
    #gameover-screen .summary { font-size: 18px; color: #8892b0; margin-bottom: 32px; line-height: 2; }
    #gameover-screen .summary span { color: #ffb13b; font-weight: 700; }

    #crosshair {
      position: absolute; width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.6); border-radius: 50%;
      pointer-events: none; display: none;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui-layer">
      <div id="menu" class="menu-screen">
        <h1>SPUD SQUAD</h1>
        <p class="subtitle">3D SURVIVORS</p>
        <div class="char-select" id="char-select"></div>
        <button class="btn" id="start-btn">开始游戏</button>
        <p style="margin-top:24px;"><a href="https://github.com/holynova/spud-squad" target="_blank" style="color:#8892b0;text-decoration:none;font-size:14px;">GitHub</a></p>
      </div>
    </div>
    <div id="hud">
      <div class="top-bar">
        <div>
          <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
          <div class="hp-text" id="hp-text">100 / 100</div>
        </div>
        <div class="stats">
          <div>波次: <span id="stat-wave">1</span></div>
          <div>击杀: <span id="stat-kills">0</span></div>
          <div>金币: <span id="stat-gold">0</span></div>
          <div>等级: <span id="stat-level">1</span></div>
        </div>
      </div>
    </div>
    <div id="wave-banner"></div>
    <div id="levelup-screen">
      <h2>升级!</h2>
      <div class="cards" id="upgrade-cards"></div>
    </div>
    <div id="gameover-screen">
      <h2>游戏结束</h2>
      <div class="summary" id="gameover-summary"></div>
      <button class="btn" id="restart-btn">重新开始</button>
    </div>
    <div id="crosshair"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
