<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">土豆小队 Spud Squad — 3D 俯视角幸存者 Roguelite</title>
  <desc id="desc">深色竞技场底标题：土豆小队，副标题武器全自动，走位定生死；右侧是俯视角竞技场，粉色土豆战士被彩色敌人包围，霰弹扇面与粒子火花四溅。</desc>

  <rect width="1200" height="360" rx="26" fill="#0a0a12"/>

  <g id="grid" stroke="#232348" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360 M600 0 V360 M660 0 V360 M720 0 V360 M780 0 V360 M840 0 V360 M900 0 V360 M960 0 V360 M1020 0 V360 M1080 0 V360 M1140 0 V360"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#9a8ac0">3D 俯视角幸存者 · 3D SURVIVORS ROGUELITE</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#ffb13b">土豆小队</text>
    <text x="56" y="168" font-size="23" fill="#e8ecf4">SPUD SQUAD — 武器全自动，走位定生死</text>
    <text x="56" y="204" font-size="19" fill="#aab6cc">5 职业、8 武器、20 波次，扛住机械异虫潮。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="108" height="36" rx="18" fill="#1c1c30" stroke="#3a3a5c" stroke-width="1.5"/><text x="110" y="262">5 职业</text></g>
      <g><rect x="176" y="238" width="108" height="36" rx="18" fill="#1c1c30" stroke="#3a3a5c" stroke-width="1.5"/><text x="230" y="262">8 武器</text></g>
      <g><rect x="296" y="238" width="168" height="36" rx="18" fill="#1c1c30" stroke="#3a3a5c" stroke-width="1.5"/><text x="380" y="262">20 波次 · 3 Boss</text></g>
      <g><rect x="476" y="238" width="138" height="36" rx="18" fill="#1c1c30" stroke="#3a3a5c" stroke-width="1.5"/><text x="545" y="262">6000 粒子</text></g>
    </g>
  </g>

  <g id="arena-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="820" y="40" font-size="18" fill="#9a8ac0">波次 1 · 异虫潮正在合围</text>
    <g id="arena">
      <circle cx="960" cy="200" r="118" fill="#14142a" stroke="#2c2c54" stroke-width="2"/>
      <circle cx="960" cy="200" r="88" fill="none" stroke="#2c2c54" stroke-width="1"/>
      <circle cx="960" cy="200" r="56" fill="none" stroke="#2c2c54" stroke-width="1"/>
      <g id="enemies">
        <circle cx="960" cy="102" r="13" fill="#ff4d6d"/>
        <circle cx="1043" cy="133" r="11" fill="#00e5ff"/>
        <circle cx="1066" cy="200" r="13" fill="#ff4d6d"/>
        <circle cx="1043" cy="267" r="12" fill="#ff9f43"/>
        <circle cx="960" cy="298" r="13" fill="#ff4d6d"/>
        <circle cx="877" cy="267" r="12" fill="#ff9f43"/>
        <circle cx="854" cy="200" r="13" fill="#ff4d6d"/>
        <circle cx="877" cy="133" r="11" fill="#7dff9b"/>
        <circle cx="1010" cy="160" r="16" fill="#6c8cff"/>
      </g>
      <g id="player" transform="translate(960 200)">
        <ellipse cx="0" cy="14" rx="16" ry="6" fill="#000000" opacity="0.4"/>
        <rect x="-10" y="-16" width="20" height="30" rx="10" fill="#f4a7b9" stroke="#d97b93" stroke-width="2"/>
        <circle cx="-4" cy="-4" r="2.5" fill="#1a1a2e"/>
        <circle cx="5" cy="-4" r="2.5" fill="#1a1a2e"/>
        <rect x="8" y="-8" width="14" height="6" rx="3" fill="#ffb13b"/>
        <circle cx="0" cy="6" r="17" fill="none" stroke="#f4a7b9" stroke-width="2" opacity="0.5"/>
      </g>
      <g id="pellets" fill="#ffe066">
        <circle cx="994" cy="176" r="3.5"/>
        <circle cx="1002" cy="188" r="3.5"/>
        <circle cx="1006" cy="200" r="3.5"/>
        <circle cx="1002" cy="212" r="3.5"/>
        <circle cx="994" cy="224" r="3.5"/>
      </g>
      <g id="sparks" fill="#ffb13b">
        <circle cx="1024" cy="148" r="3"/>
        <circle cx="1036" cy="168" r="2.5"/>
        <circle cx="1018" cy="182" r="2"/>
        <circle cx="1048" cy="190" r="3"/>
      </g>
      <polygon id="hit-burst" fill="#ffe066" stroke="#ff5f6d" stroke-width="2" opacity="0.95"
        points="1010,128 1000.4,133.4 1006.4,143.4 996.4,138 994,150 991.6,138 981.6,143.4 987.6,133.4 978,128 987.6,122.6 981.6,112.6 991.6,118 994,106 996.4,118 1006.4,112.6 1000.4,122.6"/>
    </g>
    <text x="960" y="342" font-size="18" fill="#9a8ac0" text-anchor="middle">空格冲刺 · 0.2s 无敌帧</text>
  </g>
</svg>
